name = "A cheeky seagull"
status = "done"
description = "Once in a while, someone on or near a beach holding a cooked dish (but not on every visit, and never twice in a short while) has a seagull swoop in and pinch it: '🐦 A seagull swoops down and snatches your grilled fish! It flaps off, looking very pleased with itself.' Nearby people see it too. Only cooked food, never finds or keepsakes, and rare enough to be a story, not a nuisance. 'shoo' when a gull is circling (a warning line first) scares it off."
