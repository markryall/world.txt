description = "After a deploy, open browsers reconnect by themselves but keep running the old page, so new things (like the now-playing strip or tappable names) don't show until someone happens to reload. The world tells the page which version of the page it's serving when it says welcome; if it's not the one that's open, offer a gentle 'the island's had an update ✨ tap to reload' (the log comes back after a reload, so nothing's lost)."
