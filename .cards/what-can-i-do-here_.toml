description = "Design first. Each step, the world works out what's at your spot (a music box, a board, a cat, someone to wave at, a circle) and offers it as a few taps: 📖 read the board · 🐱 pat Biscuit · 👋 wave at Sam. They fill the chip row and change as you walk, so most of the time the keyboard stays down. Words in descriptions could be taps too, opening what you can do with that thing."
