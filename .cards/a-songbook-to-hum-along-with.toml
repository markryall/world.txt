description = "Typing F#5- | D5/ on a phone keyboard is miserable, and Pachelbel's very fast part is 56 notes. A songbook of old tunes: hum along canon bass, hum along canon tune, hum along frère jacques, twinkle… Plain hum along lists the songs and their parts as taps, so joining the canon from a phone is two taps."
