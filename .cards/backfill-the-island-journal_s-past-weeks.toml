name = "Backfill the Island Journal's past weeks"
status = "done"
description = "When the Island Journal is first put up it only fills in the current week, so finds from before (like Claudia's cabbage white, caught on Sunday 1 Nov) never reach it. Backfill every earlier week from the personal journals' found_at times (first find of each species per week), so they land in the archive. For a world whose journal already exists, a one-off 'world.txt backfill-journal' could fill in the missing weeks."
