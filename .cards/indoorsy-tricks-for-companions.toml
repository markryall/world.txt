name = "Indoorsy tricks for companions"
status = "done"
description = """
Companions follow you everywhere, rooms included, but their tricks are all outdoors: indoors your fox still "pounces on a leaf", your rabbit "nibbles some clover" and your hedgehog "snuffles in the leaves", right in the middle of somebody's disco den.

Give each animal a few indoor tricks (an `indoors` list beside `tricks` in src/server/game/companions.rs), picked instead of the usual ones when its person is in room space (`in_room_space`):

  🦊 Rusty curls up on the rug, nose tucked under its tail.
  🐥 The duckling waddles under the table and peeps from there.
  🐇 The rabbit flops over on its side, utterly content.
  🦔 The hedgehog investigates a cushion, very seriously.
  🐢 The turtle finds a warm patch by the window and stays there.

- Nice if a trick notices the room: curling up on a cushion or rug that's actually placed there, peering into a jar of fireflies, settling by a lit oven. Plain ones when the room is bare.
- Strictly no poo or wee, no accidents on the rug, nothing to clean up: companions are the dream version of a pet, not a chore.
- Same pace as tricks now (about one a minute or so, to everyone on the spot), and nothing new to type.
- Every animal gets its own indoor tricks (a test checks none are left without), so nobody's companion falls back to leaves and clover on the carpet."""
