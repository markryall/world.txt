description = "On a phone everything means typing, and the keyboard takes half the screen. Let the world send words you can tap: a bit of a line can carry a command to run (a songbook pick) or text to put in the box ready to finish (a person's name sets you up to message them, @Sam, as the names in the side panel already do). People's names are taps wherever they say, do or hum something, which makes chatting discoverable on any screen. The terminal just shows the words."
