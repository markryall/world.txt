description = "Playing a gramophone or taking your jukebox turn from the terminal: ffmpeg encodes a local file to Opus (the same framing the browser's encoder uses) and the client sends frames at real-time pace. A file path stands in for the browser's file picker (play music <path>, add songs <paths>). Needs ffmpeg, which brew install mpv already brings."
