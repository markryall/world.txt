description = "When it's raining, 'jump in puddle' (or 'splash') splashes anyone standing with you. In winter or snow, 'make a snow angel' leaves one on the spot until the weather changes, and 'build a snowman' makes one that stands there for the rest of winter (others can 'look' at it, and it melts away when the season turns, told to anyone near). Lines vary."
