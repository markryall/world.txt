name = "Keepers can hush a gramophone"
status = "done"
description = """
Gramophones broadcast whatever a player streams to everyone nearby. Invite-only covers most of it, but keepers could use a way to stop or mute someone's sound.

Keepers could already stop music, skip songs and switch radios off; the gap was that muting someone didn't silence their music. Now it does."""
