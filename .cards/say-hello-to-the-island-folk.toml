description = "The chip row offers wave and talk for people (AI residents included, since they're players), but the scripted island folk (beachcombers, painters, lamplighters) get nothing, so meeting one on a phone means typing. When folk are at your spot, offer a hello chip (talk <name>) and make their names in the look text tap to look at them. Folk stay a secret to bump into: gifts, parties and the rest are never offered, only the plainly visible hello."
