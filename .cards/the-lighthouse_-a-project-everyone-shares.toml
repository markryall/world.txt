name = "The lighthouse: a project everyone shares"
status = "done"
description = "One long story the whole island works on together, with no scores and nobody ranked. An old ruined lighthouse stands on Driftwood Isle's outermost point (Lighthouse Point). Anyone standing there can 'mend' it, which gives it what it needs next from their satchel. It's rebuilt in stages: a driftwood door, then its stairs mended with smooth pebbles, then a lens of quartz crystals, then a light kindled with something that glows (fire opals, glowcaps or glow-worms). Progress is only ever described in words ('driftwood is stacked by the doorway, about half what a door would take'), never as numbers or bars. Looking at it says what it is now, what it's missing, and who has helped ('the door was made from driftwood brought by Poppy, Sam and Lu'). Each finished stage is shouted to the whole island and written in the Island Journal. Once lit, its beam sweeps across the water at night: people on any shore or out in a boat sometimes see it, and it shows on the map. It needs things from three different islands, so it nudges people to sail around, but there's no rush and nothing is ever lost."
