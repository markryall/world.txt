<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>world.txt</title>
<style>
  :root {
    --bg: #15121c; --panel: #1d1927; --line: #2c2639; --fg: #e6e1ef;
    --plain: #e6e1ef; --dim: #8d849e; --white: #ffffff; --blue: #6aa8ff; --deep_blue: #3b5bdb;
    --cyan: #5fe0e0; --green: #7ed87e; --dark_green: #3f9a4f; --yellow: #ffd866; --sand: #e8cf9a;
    --magenta: #ff79c6; --pink: #ffa7d6; --red: #ff6b6b; --brown: #c08a5a; --grey: #a0a0a8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body { font: 15px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; display: flex; flex-direction: column; height: 100dvh; }
  #app { flex: 1; display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
  #log { overflow-y: auto; padding: 14px 16px; white-space: pre-wrap; word-wrap: break-word; }
  #log .ln { min-height: 1.45em; border-radius: 4px; }
  #log .ln:hover { background: var(--panel); }
  #log .ln.was { opacity: 0.7; }
  #side { background: var(--panel); border-left: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  #place { color: var(--magenta); font-weight: bold; }
  /* One line each, so a long place name never pushes the map about: anything
     too long ends in … (the whole of it shows on hover). */
  #place, #weather, #clock, #now { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 100%; flex-shrink: 0; }
  #map { font-size: 16px; line-height: 1.15; white-space: pre; text-align: center; padding: 6px 0; }
  .meta { color: var(--dim); font-size: 13px; }
  #pad { display: grid; grid-template-columns: repeat(3, 52px); gap: 6px; justify-content: center; }
  #pad button, .quick button {
    background: var(--line); color: var(--fg); border: 0; border-radius: 10px; font: inherit;
    height: 44px; cursor: pointer; touch-action: manipulation;
  }
  #pad button:active, .quick button:active { background: var(--magenta); color: var(--bg); }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .quick button { padding: 0 12px; height: 36px; font-size: 13px; }
  form#input { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--panel); }
  #rsearch { display: none; align-self: center; color: var(--yellow); font-size: 13px; white-space: nowrap; max-width: 40%; overflow: hidden; text-overflow: ellipsis; }
  #rsearch.on { display: block; }
  #cmd { flex: 1; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 16px; outline: none; }
  #cmd:focus { border-color: var(--magenta); }
  #join { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #join form { text-align: center; max-width: 360px; width: 100%; }
  #join h1 { color: var(--magenta); font-weight: normal; letter-spacing: 2px; }
  #join p { color: var(--dim); }
  #join input { width: 100%; font: inherit; font-size: 18px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); text-align: center; outline: none; }
  #join button { margin-top: 12px; width: 100%; font: inherit; font-size: 17px; padding: 12px; border: 0; border-radius: 12px; background: var(--magenta); color: var(--bg); cursor: pointer; }
  #here a { color: var(--cyan); }
  /* Who else is out in the world, at the foot of the side panel: it grows
     upward and scrolls, so nothing above it ever moves. */
  #here { display: none; }
  #people { margin-top: auto; border-top: 1px solid var(--line); padding-top: 8px; font-size: 13px;
    max-height: 30vh; overflow-y: auto; flex-shrink: 0; }
  #people .who { color: var(--dim); margin-bottom: 4px; }
  #people .p { display: flex; gap: 8px; align-items: baseline; white-space: nowrap; }
  #people a { color: var(--cyan); text-decoration: none; overflow: hidden; text-overflow: ellipsis; }
  #people a:hover { text-decoration: underline; }
  #people .bot a { color: var(--dim); }
  #people .t { color: var(--dim); margin-left: auto; flex-shrink: 0; }
  #people .here { color: var(--yellow); flex-shrink: 0; }
  /* Progress bars from boards you follow or are near: the bar, then its label on the right. */
  #bars { display: flex; flex-direction: column; gap: 6px; font-size: 13px; flex-shrink: 0; }
  #bars:empty { display: none; }
  #bars .bar { display: flex; align-items: center; gap: 8px; min-width: 0; }
  #bars .track { flex: 1; min-width: 60px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  #bars .fill { height: 100%; background: var(--green, #7ed87e); border-radius: 4px; transition: width .4s ease; }
  #bars .full .fill { background: var(--yellow); }
  #bars .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
  #bars .amt { color: var(--dim); flex-shrink: 0; }
  #bars .light { display: flex; align-items: baseline; gap: 6px; min-width: 0; white-space: nowrap; }
  #bars .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; align-self: center; background: var(--green); }
  #bars .down .dot { background: var(--red); box-shadow: 0 0 6px var(--red); }
  #bars .light .lbl { max-width: none; }
  #bars .light .amt { overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; }
  #bars .light a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  #log a, #notes a { color: inherit; text-decoration: underline; text-underline-offset: 2px; word-break: break-all; }
  #hint { display: none; align-items: center; gap: 10px; padding: 10px 14px; background: var(--panel);
    border-top: 1px solid var(--line); color: var(--yellow); font-weight: bold; cursor: pointer; }
  #hint.on { display: flex; animation: glow 2s ease-in-out infinite; }
  #gramo { display: none; align-items: center; gap: 10px; padding: 8px 14px; background: var(--panel);
    border-top: 1px solid var(--line); color: var(--pink); font-size: 14px; }
  #gramo.on { display: flex; }
  #gramo-msg { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #gramo label, #gramo button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg); white-space: nowrap; }
  #hint .go { margin-left: auto; background: var(--yellow); color: var(--bg); border-radius: 8px; padding: 4px 10px; font-size: 13px; }
  #hint .skip { color: var(--dim); font-weight: normal; font-size: 12px; text-decoration: underline; }
  @keyframes glow { 50% { background: #2a2333; } }
  .pulse { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { background: var(--yellow); color: var(--bg); } }
  @media (prefers-reduced-motion: reduce) { #hint.on, .pulse { animation: none; } .pulse { outline: 2px solid var(--yellow); } }
  #sound { background: none; border: 0; color: var(--dim); font: inherit; cursor: pointer; padding: 0; }
  #board { position: fixed; inset: 6vh 50% auto auto; transform: translateX(50%); width: min(560px, 94vw);
    height: 80vh; display: none; flex-direction: column; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.5); z-index: 5; overflow: hidden; }
  #board.on { display: flex; }
  #board header { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  #board h2 { margin: 0; font-size: 16px; color: var(--yellow); flex: 1; }
  #board .page { width: 100%; color: var(--dim); font-size: 13px; }
  #board select { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 13px; padding: 4px; }
  #board .close { background: none; border: 0; color: var(--dim); font-size: 22px; cursor: pointer; line-height: 1; }
  #notes { flex: 1; overflow-y: auto; padding: 10px 14px; white-space: pre-wrap; word-wrap: break-word; }
  #notes .n { margin: 0 0 10px; }
  #notes .who { color: var(--cyan); font-weight: bold; }
  #notes .when { color: var(--dim); font-size: 12px; margin-left: 6px; }
  #notes .older { color: var(--dim); text-align: center; font-size: 12px; padding: 4px 0 10px; }
  #board form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
  #board form input { flex: 1; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 16px; outline: none; }
  #board form button { background: var(--yellow); color: var(--bg); border: 0; border-radius: 10px; padding: 0 14px; font: inherit; cursor: pointer; }
  @media (max-width: 720px) { #board { inset: 0; transform: none; width: auto; height: auto; border-radius: 0; } }
  #chips { display: none; gap: 6px; overflow-x: auto; padding: 8px 12px 0; background: var(--panel);
    border-top: 1px solid var(--line); scrollbar-width: none; }
  #chips::-webkit-scrollbar { display: none; }
  #chips button { flex: none; background: var(--line); color: var(--fg); border: 0; border-radius: 16px;
    font: inherit; font-size: 14px; height: 34px; padding: 0 12px; touch-action: manipulation; }
  #chips button:active { background: var(--magenta); color: var(--bg); }
  @media (max-width: 720px) {
    #chips { display: flex; }
    #input { border-top: 0; }
    /* While typing, the keyboard needs the room: keep just the place name. */
    body.typing #map, body.typing #pad, body.typing #weather, body.typing #clock, body.typing #now,
    body.typing #here, body.typing #sound { display: none; }
    body.typing #side { padding: 6px 12px; }
    #app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    #side { order: -1; border-left: 0; border-bottom: 1px solid var(--line); flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: center; padding: 8px; gap: 8px 14px; }
    #map { font-size: 13px; padding: 0; }
    #pad { grid-template-columns: repeat(3, 42px); gap: 4px; }
    #pad button { height: 34px; }
    .info { flex: 1; min-width: 150px; }
    .quick { display: none; }
    #people { display: none; }
    #here { display: block; }
    #bars { width: 100%; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="log" aria-live="polite"></div>
  <div id="side">
    <div class="info">
      <div id="place">…</div>
      <div class="meta" id="weather"></div>
      <div class="meta" id="clock"></div>
      <div class="meta" id="now" title="the real date and time where you are: event times are in this"></div>
      <div class="meta" id="here"></div>
      <button id="sound" type="button">🔇 sound off</button>
    </div>
    <div id="map"></div>
    <div id="pad">
      <button data-c="nw">↖</button><button data-c="n">↑</button><button data-c="ne">↗</button>
      <button data-c="w">←</button><button data-c="look">👀</button><button data-c="e">→</button>
      <button data-c="sw">↙</button><button data-c="s">↓</button><button data-c="se">↘</button>
    </div>
    <div class="quick">
      <button data-c="help">help</button><button data-c="gather" title="gather whatever's here">🧺</button>
      <button data-c="satchel" title="what's in your satchel">🎒</button>
    </div>
    <div id="bars"></div>
    <div id="people"></div>
  </div>
</div>
<div id="hint" role="button" tabindex="0">
  <span id="hint-text"></span><span class="go">try it</span><span class="skip" id="hint-skip">skip</span>
</div>
<div id="chips">
  <button data-prefill="say ">💬 say</button><button data-c="gather">🧺 gather</button>
  <button data-c="satchel">🎒 satchel</button><button data-c="journal">📖 journal</button>
  <button data-c="plant flowers">🌼 plant</button><button data-c="fish">🎣 fish</button>
  <button data-prefill="chat ">📣 chat</button><button data-c="who">who</button>
  <button data-c="read">📌 read</button><button data-c="map">🗺 map</button><button data-c="look">👀 look</button><button data-c="help">help</button>
</div>
<div id="gramo">
  <span id="gramo-msg">🎶 Choose some songs to play on the gramophone</span>
  <label><span id="gramo-pick">🎵 choose songs</span><input id="gramo-files" type="file" accept="audio/*" multiple hidden></label>
  <button id="gramo-stop" type="button">⏹ stop</button>
</div>
<form id="input" autocomplete="off">
  <span id="rsearch" aria-live="polite"></span>
  <input id="cmd" placeholder="say hi, dig, make a frog that croaks when it rains…" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
</form>
<div id="board" role="dialog" aria-label="noticeboard">
  <header>
    <h2 id="board-title"></h2>
    <select id="board-weeks" aria-label="past weeks"></select>
    <button class="close" id="board-close" aria-label="close">×</button>
    <div class="page" id="board-page"></div>
  </header>
  <div id="notes"></div>
  <form id="board-post" autocomplete="off">
    <input id="board-text" placeholder="leave a note…" maxlength="280" enterkeyhint="send">
    <button>post</button>
  </form>
</div>
<div id="join">
  <form>
    <h1>✨ world.txt ✨</h1>
    <p>a small island · no battles · just bonhomie</p>
    <p id="join-msg"></p>
    <button id="join-go" type="submit" hidden>Enter the world 🌍</button>
  </form>
</div>
<script>
const $ = (s) => document.querySelector(s);
const log = $('#log');
let ws, sky = '', audio, soundOn = false, rain;
const typed = []; let hist = 0;

// The recent log is kept on this device (per world), so a refresh or a
// restart picks up where you were instead of starting blank.
const LOG = 'world.log';
const LOG_KEEP = 300;
let kept = [], keepTimer = null;

function addLines(lines, when, replay) {
  const stick = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  const at = when || Date.now();
  for (const line of lines) {
    const div = document.createElement('div');
    div.className = 'ln';
    // When it happened, on hover.
    div.title = new Date(at).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' });
    div.appendChild(paintLine(line));
    log.appendChild(div);
    if (replay) continue;
    kept.push([at, line]);
    const tune = line.map((s) => s.t).join('').match(/♪ (.+) ♪/);
    if (tune) playTune(tune[1]);
  }
  while (log.childNodes.length > 1000) log.removeChild(log.firstChild);
  if (stick) log.scrollTop = log.scrollHeight;
  if (!replay && !keepTimer) keepTimer = setTimeout(keepLog, 1000);
}

function keepLog() {
  keepTimer = null;
  if (kept.length > LOG_KEEP) kept = kept.slice(-LOG_KEEP);
  store(LOG, JSON.stringify(kept));
}

// What was on screen last time, faded a little, with a gap before what's new.
function restoreLog() {
  try { kept = JSON.parse(stored(LOG) || '[]').filter((e) => Array.isArray(e) && Array.isArray(e[1])); } catch { kept = []; }
  if (!kept.length) return;
  for (const [at, line] of kept) addLines([line], at, true);
  log.querySelectorAll('.ln').forEach((d) => d.classList.add('was'));
  addLines([[{ t: '· · ·', c: 'dim' }]], Date.now(), true);
}

function paintLine(line) {
  const frag = document.createDocumentFragment();
  for (const s of line) {
    const span = document.createElement('span');
    linkify(span, s.t.replace('<world address>', location.origin + location.pathname.replace(/\/$/, '')));
    span.style.color = `var(--${s.c})`;
    if (s.b) span.style.fontWeight = 'bold';
    frag.appendChild(span);
  }
  return frag;
}

// Text, with any https links in it made clickable (a call, a build), opening
// in a new tab so the island stays put.
// Links are the only formatting: plain https ones, and markdown-style
// [the notes](https://…), which show their words (hover for where they go).
// Nothing else in markdown means anything here.
function linkify(el, text) {
  const link = (url, label) => {
    const a = document.createElement('a');
    a.href = url; a.textContent = label; a.title = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    return a;
  };
  const re = /\[([^\[\]\n]{1,100})\]\((https:\/\/[^\s<>"')]+)\)|(https:\/\/[^\s<>"']+)/g;
  let at = 0;
  for (const m of text.matchAll(re)) {
    if (m.index > at) el.append(text.slice(at, m.index));
    if (m[1] !== undefined && m[1].trim()) {
      el.append(link(m[2], m[1].trim()));
      at = m.index + m[0].length;
    } else if (m[3] !== undefined) {
      const url = m[3].replace(/[.,!?;:)\]]+$/, '');
      el.append(link(url, url));
      at = m.index + url.length;
    } else {
      el.append(m[0]);
      at = m.index + m[0].length;
    }
  }
  if (at < text.length) el.append(text.slice(at));
}

// Ask for the plain-text look of symbols phones like to draw as wide emoji
// (☺ ♣ ▲ ☀ ☁ …), so the map's columns stay lined up.
const textStyle = (s) => ({ ...s, t: s.t.replace(/([\u2600-\u27BF])(?!\uFE0E)/g, '$1\uFE0E') });

function status(m) {
  for (const [el, text] of [['#place', m.place], ['#weather', m.weather], ['#clock', m.clock]]) {
    $(el).textContent = text;
    $(el).title = text;
  }
  const here = $('#here');
  here.replaceChildren();
  if (m.here.length) here.append('☺ ');
  m.here.forEach((name, i) => {
    if (i) here.append(', ');
    const a = document.createElement('a');
    a.textContent = name; a.href = '#'; a.title = 'talk to ' + name;
    a.onclick = (e) => { e.preventDefault(); prefill('@' + name + ' '); };
    here.append(a);
  });
  people = m.people || [];
  showPeople();
  showBars(m.progress || [], m.lights || []);
  const map = $('#map');
  map.replaceChildren();
  m.map.forEach((line, i) => {
    if (i) map.appendChild(document.createTextNode('\n'));
    map.appendChild(paintLine(line.map(textStyle)));
  });
  sky = m.weather;
  updateRain();
}

// ---- signing in ----------------------------------------------------------
// The world is invite-only. A magic link (#invite=...) is used once and
// swapped for a device token, kept here so next time just works.
const stored = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const store = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };
const params = new URLSearchParams(location.hash.slice(1));
let invite = params.get('invite');
// Arriving from another world, with a passport from home.
let passport = params.get('passport');

function showJoin(message, enter = false) {
  $('#join').style.display = 'flex';
  $('#join-msg').textContent = message;
  $('#join-go').hidden = !enter;
  if (enter) $('#join-go').focus();
}
$('#join form').onsubmit = (e) => {
  e.preventDefault();
  if (!$('#join-go').hidden) start();
};

function start() {
  $('#join').style.display = 'none';
  connect();
  $('#cmd').focus();
}

// Staying connected: when the connection drops without the world saying
// goodbye (a restart, a redeploy, a phone waking up), wait a moment and come
// back in with this device's token, keeping everything on screen.
let byeSeen = false, restarting = false, retries = 0, retryTimer = null, lostSaid = false;

function lost() {
  hostStop();
  jukeStop();
  for (const thing of Object.keys(listening)) unhear(thing);
  if (byeSeen || !stored('world.token')) {
    addLines([[{ t: '✧ The world fades. Refresh to wander back in.', c: 'dim' }]]);
    return;
  }
  if (!lostSaid && !restarting) addLines([[{ t: '✧ The world goes quiet for a moment. Finding your way back…', c: 'dim' }]]);
  lostSaid = true;
  const wait = restarting ? 2500 : Math.min(15000, 1000 * 2 ** retries);
  retries++;
  clearTimeout(retryTimer);
  retryTimer = setTimeout(connect, wait);
}

// Progress bars outside tools keep filling on noticeboards you follow or are near.
function showBars(bars, lights) {
  const el = $('#bars');
  const span = (className, textContent) => Object.assign(document.createElement('span'), { className, textContent });
  // Two with the same label (on different boards) say where they are.
  const shared = (xs) => new Set(xs.map((x) => x.label).filter((label, i, all) => all.indexOf(label) !== i));
  const sharedLights = shared(lights), sharedBars = shared(bars);
  const named = (x, set) => (set.has(x.label) && x.place ? `${x.label} · ${x.place}` : x.label);
  const lightRows = lights.map((l) => {
    // A note's links show as their words, clickable; the hover has the words too.
    const words = (l.note || '').replace(/\[([^\[\]\n]{1,100})\]\((https:\/\/[^\s<>"')]+)\)/g, '$1');
    const row = Object.assign(document.createElement('div'), { className: 'light' + (l.up ? '' : ' down'), title: `${l.label}${l.place ? ' (at ' + l.place + ')' : ''} is ${l.up ? 'up' : 'down'}${words ? ': ' + words : ''}` });
    const amt = span('amt', l.up ? 'up' : 'down');
    if (!l.up && l.note) { amt.append(' · '); linkify(amt, l.note); }
    row.append(span('dot', ''), span('lbl', named(l, sharedLights)), amt);
    return row;
  });
  el.replaceChildren(...lightRows, ...bars.map((b) => {
    const pct = Math.round(100 * Math.min(b.done, b.total) / Math.max(b.total, 1));
    const amount = b.total === 100 ? `${b.done}%` : `${b.done}/${b.total}`;
    const row = Object.assign(document.createElement('div'), { className: 'bar' + (pct >= 100 ? ' full' : ''), title: `${b.label}${b.place ? ' (at ' + b.place + ')' : ''}: ${b.done} of ${b.total} (${pct}%)` });
    const track = Object.assign(document.createElement('div'), { className: 'track' });
    const fill = Object.assign(document.createElement('div'), { className: 'fill' });
    fill.style.width = pct + '%';
    track.append(fill);
    row.append(track,
      Object.assign(document.createElement('span'), { className: 'lbl', textContent: named(b, sharedBars) }),
      Object.assign(document.createElement('span'), { className: 'amt', textContent: amount }));
    return row;
  }));
}

// Everyone else out in the world, with what time it is for them; tap a name
// to talk to them.
let people = [];
function showPeople() {
  const el = $('#people');
  el.replaceChildren();
  if (!people.length) {
    el.append(Object.assign(document.createElement('div'), { className: 'who', textContent: 'Nobody else is out just now.' }));
    return;
  }
  const n = people.filter((p) => !p.bot).length;
  el.append(Object.assign(document.createElement('div'), { className: 'who', textContent: n === 1 ? '1 other person out in the world' : `${n} other people out in the world` }));
  for (const p of people) {
    const row = document.createElement('div');
    row.className = 'p' + (p.bot ? ' bot' : '');
    const a = document.createElement('a');
    a.href = '#'; a.textContent = (p.bot ? '🐾 ' : '☺ ') + p.name; a.title = 'talk to ' + p.name;
    a.onclick = (e) => { e.preventDefault(); prefill('@' + p.name + ' '); };
    row.append(a);
    if (p.here) row.append(Object.assign(document.createElement('span'), { className: 'here', textContent: 'here' }));
    const t = document.createElement('span');
    t.className = 't';
    if (p.tz) {
      try {
        t.textContent = new Date().toLocaleTimeString([], { timeZone: p.tz, hour: 'numeric', minute: '2-digit', hour12: true }).toLowerCase().replace(' ', '');
        t.title = `their time (${p.tz.split('/').pop().replace(/_/g, ' ')})`;
      } catch { /* a zone this browser doesn't know */ }
    } else if (p.bot) {
      t.textContent = 'resident';
    }
    row.append(t);
    el.append(row);
  }
}

// The real date and time where you are, beside the island's own clock, so
// event times (which are in your time) are easy to place.
function showNow() {
  const d = new Date();
  const day = d.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
  const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true }).toLowerCase().replace(' ', '');
  $('#now').textContent = `🕰 ${day}, ${time} · your time`;
}
showNow();
setInterval(() => { showNow(); showPeople(); }, 15000);

// This browser's timezone ("Australia/Sydney"), so event times can be yours.
function zone() {
  try { return Intl.DateTimeFormat().resolvedOptions().timeZone || null; } catch { return null; }
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  byeSeen = false;
  ws = new WebSocket(`${proto}://${location.host}/`);
  ws.onopen = () => ws.send(JSON.stringify({
    // A device token for this world wins: they've been here before.
    type: 'hello', invite, token: invite ? null : stored('world.token'), back: lostSaid || restarting, tz: zone(),
    passport: invite || stored('world.token') ? null : passport,
  }));
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'lines') addLines(m.lines);
    else if (m.type === 'status') status(m);
    else if (m.type === 'hint') hint(m);
    else if (m.type === 'board') board(m);
    else if (m.type === 'spin_start') hostStart(m.thing);
    else if (m.type === 'juke_add') jukeAdd(m.thing);
    else if (m.type === 'juke_turn') jukeTurn(m.thing, m.key);
    else if (m.type === 'juke_stop') jukeStop();
    else if (m.type === 'spin_stop') hostStop();
    else if (m.type === 'audio') hear(m);
    else if (m.type === 'audio_end') unhear(m.thing);
    else if (m.type === 'radio') tuneIn(m);
    else if (m.type === 'travel') {
      // Off to another world (or home): row there in a moment.
      setTimeout(() => { location.href = m.url; }, 1800);
    } else if (m.type === 'restarting') {
      restarting = true;
      addLines([[{ t: '🌙 The world is being tidied up. Back in a moment…', c: 'magenta' }]]);
    } else if (m.type === 'welcome') {
      if (lostSaid || restarting) addLines([[{ t: '✨ And you\'re back.', c: 'magenta' }]]);
      lostSaid = restarting = false;
      retries = 0;
      if (m.token) store('world.token', m.token);
      // The invite or passport is used up: tidy it out of the address bar.
      invite = null;
      passport = null;
      history.replaceState(null, '', location.pathname);
    } else if (m.type === 'bye') {
      byeSeen = true;
      if (m.reason.includes('🛂')) {
        showJoin(m.reason);
      } else if (invite && m.reason.includes('invite') && stored('world.token')) {
        // An old link left in the address bar, but this device is already
        // signed in: drop the link and come in with the device's token.
        invite = null;
        history.replaceState(null, '', location.pathname);
        connect();
      } else if (m.reason.includes('invite') || m.reason.includes('signed in')) {
        if (m.reason.includes('signed in')) { store('world.token', null); store(LOG, null); kept = []; }
        showJoin(m.reason);
      } else {
        addLines([[{ t: m.reason, c: 'magenta' }]]);
      }
    }
  };
  ws.onclose = (e) => {
    // A connection we've already replaced (signing in again) can go quietly.
    if (e.target === ws) lost();
  };
}

let boardId = null, boardMore = false, boardLoading = false;

function noteEl(n) {

  d.className = 'n';

  const when = document.createElement('span'); when.className = 'when'; when.textContent = n.when;

function olderMarker() {
  const d = document.createElement('div');
  d.className = 'older';
  d.textContent = boardMore ? '↑ scroll up for older notes' : 'the very first note';
  return d;
}
function board(m) {
  if (m.mode === 'new') {
    if (boardId !== m.board || !$('#board').classList.contains('on')) return;
    const stick = notesEl.scrollHeight - notesEl.scrollTop - notesEl.clientHeight < 60;
    m.notes.forEach((n) => notesEl.append(noteEl(n)));

  $('#board-title').textContent = m.title;

$('#board-close').onclick = () => $('#board').classList.remove('on');

// Command history: kept on this device (per world), ↑/↓ to step through it,
// and Ctrl-R to search back through it like a shell.
const HISTORY = 'world.history';
const HISTORY_MAX = 300;
try { typed.push(...JSON.parse(stored(HISTORY) || '[]').filter((t) => typeof t === 'string')); } catch {}
hist = typed.length;
function remember(text) {
  const i = typed.lastIndexOf(text);
  if (i !== -1) typed.splice(i, 1); // the newest copy is the one that counts
  typed.push(text);
  typed.splice(0, Math.max(0, typed.length - HISTORY_MAX));
  hist = typed.length;
  store(HISTORY, JSON.stringify(typed));
}

$('#input').onsubmit = (e) => {
  e.preventDefault();

};

// Ctrl-R: type to find the newest command containing it, Ctrl-R again for older
// ones; Enter runs it, → or Tab keeps it to edit, Esc (or Ctrl-G) puts things back.
let search = null; // { q, at, before }
function findBack(q, from) {
  for (let i = Math.min(from, typed.length - 1); i >= 0; i--) {
    if (typed[i].toLowerCase().includes(q.toLowerCase())) return i;
  }
  return -1;
}
function showSearch() {
  const found = search.at >= 0;
  $('#rsearch').textContent = `${found || !search.q ? '' : 'no match '}🔍 ${search.q}`;
  $('#rsearch').classList.add('on');
  if (found) $('#cmd').value = typed[search.at];
}
function endSearch(keep) {
  if (!search) return;
  if (!keep) $('#cmd').value = search.before;
  search = null;
  $('#rsearch').classList.remove('on');
}
$('#cmd').onkeydown = (e) => {
  const ctrl = e.ctrlKey && !e.metaKey && !e.altKey;
  if (ctrl && e.key === 'r') {
    e.preventDefault();
    if (!search) search = { q: '', at: -1, before: $('#cmd').value };
    else if (search.q) {
      const older = findBack(search.q, search.at - 1);
      if (older >= 0) search.at = older;
    }
    return showSearch();
  }
  if (search) {
    if (e.key === 'Escape' || (ctrl && e.key === 'g')) { e.preventDefault(); return endSearch(false); }
    if (e.key === 'Enter') return endSearch(true); // the form sends it
    if (e.key === 'Tab' || e.key.startsWith('Arrow')) { e.preventDefault(); return endSearch(true); }
    if (e.key === 'Backspace') {
      e.preventDefault();
      search.q = search.q.slice(0, -1);
      search.at = search.q ? findBack(search.q, typed.length - 1) : -1;
      if (!search.q) $('#cmd').value = search.before;
      return showSearch();
    }
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      search.q += e.key;
      const at = findBack(search.q, search.at >= 0 ? search.at : typed.length - 1);
      search.at = at >= 0 ? at : findBack(search.q, typed.length - 1);
      return showSearch();
    }
    return;
  }
  if (e.key === 'ArrowUp' && hist > 0) { hist--; $('#cmd').value = typed[hist]; e.preventDefault(); }
  if (e.key === 'ArrowDown') { hist = Math.min(typed.length, hist + 1); $('#cmd').value = typed[hist] || ''; e.preventDefault(); }
};
$('#cmd').onblur = () => endSearch(true);

// ---- gramophones and radios ---------------------------------------------
// Someone near a gramophone hears songs from another player's computer: the
// player's browser encodes them (Opus, 20ms frames) and the world passes them
// on with how loud they are where you stand. Radios are simpler: the world
// says which stream is in earshot and how loud, and the browser plays it.
// Either way, the world makes sure you only ever hear one at a time.

const b64 = (bytes) => { let s = ''; for (const b of bytes) s += String.fromCharCode(b); return btoa(s); };
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const told = new Set();
function tellOnce(key, text) {
  if (told.has(key)) return;
  told.add(key);
  addLines([[{ t: text, c: 'pink' }]]);
}

// Playing: this browser is the gramophone's record player.
const FRAME = 960; // 20ms at 48kHz
const TAP = `class Tap extends AudioWorkletProcessor {
  process(inputs, outputs) {
    const i = inputs[0], o = outputs[0];
    if (i.length) {
      for (let c = 0; c < o.length; c++) o[c].set(i[Math.min(c, i.length - 1)]);
      this.port.postMessage([i[0].slice(), (i[1] || i[0]).slice()]);
    }
    return true;
  }
}
registerProcessor('tap', Tap);`;
const gramo = { thing: null, ctx: null, el: null, encoder: null, timer: null, files: [], idx: 0, ts: 0, pending: [], title: null,
  onEnd: null, accL: new Float32Array(FRAME), accR: new Float32Array(FRAME), accN: 0 };
// Songs waiting on a jukebox: they stay here, by key, until their turn.
const juke = { thing: null, files: new Map() };
const canPlay = () => 'AudioEncoder' in window;

// The bar above the input: playing a gramophone, adding to a jukebox, or
// your jukebox song playing.
let barMode = null;
function bar(mode, msg) {
  barMode = mode;
  $('#gramo').classList.toggle('on', !!mode);
  if (!mode) return;
  $('#gramo-msg').textContent = msg;
  $('#gramo-pick').parentElement.hidden = mode === 'juke-turn' || !canPlay();
  $('#gramo-pick').textContent = mode === 'gramophone' ? '🎵 choose songs' : '📀 add songs';
  $('#gramo-stop').textContent = { gramophone: '⏹ stop', 'juke-add': '✕ done', 'juke-turn': '⏭ skip' }[mode];
}

// The record player: an audio element, tapped and encoded as it plays.
async function recorder() {
  if (gramo.ctx) return;
  const ctx = new AudioContext({ sampleRate: 48000 });
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([TAP], { type: 'application/javascript' })));
  const el = new Audio();
  el.onended = () => gramo.onEnd?.();
  const tap = new AudioWorkletNode(ctx, 'tap', { outputChannelCount: [2] });
  ctx.createMediaElementSource(el).connect(tap).connect(ctx.destination);
  tap.port.onmessage = (e) => encode(e.data);
  const encoder = new AudioEncoder({
    output: (chunk) => { const b = new Uint8Array(chunk.byteLength); chunk.copyTo(b); gramo.pending.push(b64(b)); },
    error: (e) => { $('#gramo-msg').textContent = `🎶 Couldn't play that: ${e.message}`; },
  });
  encoder.configure({ codec: 'opus', sampleRate: 48000, numberOfChannels: 2, bitrate: 96000 });
  Object.assign(gramo, { ctx, el, encoder, timer: setInterval(sendAudio, 200) });
}

function playFile(f) {
  if (gramo.el.src) URL.revokeObjectURL(gramo.el.src);
  gramo.el.src = URL.createObjectURL(f);
  gramo.title = f.name.replace(/\.[^.]+$/, '');
  gramo.el.play().catch(() => {});
}

// Gramophone: your songs, round and round, until you stop.
function hostStart(thing) {
  gramo.thing = thing;
  bar('gramophone', canPlay() ? '🎶 Choose some songs to play on the gramophone' : "🎶 This browser can't play to a gramophone yet. Chrome can!");
}

async function hostPlay(files) {
  if (!files.length || !canPlay()) return;
  gramo.files = [...files];
  gramo.idx = 0;
  try {
    await recorder();
    await gramo.ctx.resume();
    gramo.onEnd = () => { gramo.idx = (gramo.idx + 1) % gramo.files.length; playTrack(); };
    playTrack();
  } catch (e) {
    $('#gramo-msg').textContent = `🎶 Couldn't start the gramophone: ${e.message}`;
  }
}

function playTrack() {
  const f = gramo.files[gramo.idx];
  if (!f) return;
  playFile(f);
  $('#gramo-msg').textContent = `🎶 Playing ${gramo.title}`;
}

// Gather the tapped sound into 20ms frames for the encoder.
function encode([l, r]) {
  if (!gramo.encoder || gramo.encoder.state !== 'configured' || gramo.el?.paused) return;
  for (let off = 0; off < l.length;) {
    const n = Math.min(FRAME - gramo.accN, l.length - off);
    gramo.accL.set(l.subarray(off, off + n), gramo.accN);
    gramo.accR.set(r.subarray(off, off + n), gramo.accN);
    gramo.accN += n; off += n;
    if (gramo.accN === FRAME) {
      const data = new Float32Array(FRAME * 2);
      data.set(gramo.accL, 0); data.set(gramo.accR, FRAME);
      const frame = new AudioData({ format: 'f32-planar', sampleRate: 48000, numberOfFrames: FRAME, numberOfChannels: 2, timestamp: gramo.ts, data });
      gramo.ts += 20000;
      gramo.encoder.encode(frame);
      frame.close();
      gramo.accN = 0;
    }
  }
}

function sendAudio() {
  if (!gramo.pending.length || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type: 'audio', frames: gramo.pending.splice(0, 50), title: gramo.title }));
}

function hostStop() {
  clearInterval(gramo.timer);
  try { gramo.encoder?.close(); } catch {}
  gramo.el?.pause();
  gramo.ctx?.close();
  Object.assign(gramo, { thing: null, ctx: null, el: null, encoder: null, timer: null, files: [], pending: [], title: null, onEnd: null, accN: 0 });
  bar(null);
  $('#gramo-files').value = '';
}

// Jukebox: pick songs (only their titles go to the world), then wait for your turn.
function jukeAdd(thing) {
  juke.thing = thing;
  bar('juke-add', canPlay() ? '📀 Choose songs for the jukebox' : "📀 This browser can't play to a jukebox yet. Chrome can!");
}

function jukeQueue(files) {
  const songs = [...files].map((f) => {
    const key = Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
    juke.files.set(key, f);
    return { key, title: f.name.replace(/\.[^.]+$/, '') };
  });
  if (!songs.length || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type: 'queue', thing: juke.thing, songs }));
  bar('juke-add', `📀 Added ${songs.length === 1 ? 'a song' : songs.length + ' songs'}. Keep this tab open until your turn 🎶`);
}

async function jukeTurn(thing, key) {
  const f = juke.files.get(key);
  const done = () => ws?.readyState === 1 && ws.send(JSON.stringify({ type: 'track_done', thing, key }));
  if (!f || !canPlay()) return done();
  try {
    await recorder();
    await gramo.ctx.resume();
    gramo.onEnd = () => { juke.files.delete(key); gramo.onEnd = null; bar(null); done(); };
    playFile(f);
    bar('juke-turn', `📀 Your song is playing on the jukebox: ${gramo.title}`);
  } catch (e) {
    done();
  }
}

function jukeStop() {
  gramo.onEnd = null;
  gramo.el?.pause();
  gramo.pending = [];
  if (barMode === 'juke-turn') bar(null);
}

$('#gramo-files').onchange = (e) => {
  if (barMode === 'gramophone') hostPlay(e.target.files);
  else jukeQueue(e.target.files);
  e.target.value = '';
};
$('#gramo-stop').onclick = () => {
  if (barMode === 'gramophone') send('stop music');
  else if (barMode === 'juke-turn') send('skip');
  else bar(null);
};

// Listening: frames from a gramophone in earshot, played a moment behind.
const listening = {};
function hear(m) {
  if (!('AudioDecoder' in window)) return tellOnce('nodecoder', "🎶 There's music nearby, but this browser can't play it yet.");
  if (!soundOn || !audio) return tellOnce('soundoff', '🎶 There\'s music playing nearby. Turn the sound on (🔇 above the map) to hear it.');
  let l = listening[m.thing];
  if (!l) {
    const gain = audio.createGain();
    gain.gain.value = 0;
    gain.connect(audio.destination);
    l = listening[m.thing] = { gain, next: 0, ts: 0 };
    l.dec = new AudioDecoder({ output: (frame) => playFrame(l, frame), error: () => {} });
    l.dec.configure({ codec: 'opus', sampleRate: 48000, numberOfChannels: 2 });
  }
  l.gain.gain.setTargetAtTime(m.gain * 0.8, audio.currentTime, 0.4);
  for (const f of m.frames) {
    l.dec.decode(new EncodedAudioChunk({ type: 'key', timestamp: l.ts, data: unb64(f) }));
    l.ts += 20000;
  }
}

function playFrame(l, frame) {
  const buf = audio.createBuffer(frame.numberOfChannels, frame.numberOfFrames, frame.sampleRate);
  for (let c = 0; c < frame.numberOfChannels; c++) {
    const ch = new Float32Array(frame.numberOfFrames);
    frame.copyTo(ch, { planeIndex: c, format: 'f32-planar' });
    buf.copyToChannel(ch, c);
  }
  frame.close();
  // A little behind, so the network's wobbles don't make gaps; start afresh after one.
  const now = audio.currentTime;
  if (l.next < now + 0.05) l.next = now + 0.4;
  const src = audio.createBufferSource();
  src.buffer = buf;
  src.connect(l.gain);
  src.start(l.next);
  l.next += buf.duration;
}

function unhear(thing) {
  const l = listening[thing];
  if (!l) return;
  delete listening[thing];
  l.gain.gain.setTargetAtTime(0, audio.currentTime, 0.3);
  try { l.dec.close(); } catch {}
  setTimeout(() => l.gain.disconnect(), 2000);
}

// Radios: the station's own stream, at a volume for how near you are.
const radios = {};
function playRadio(el) {
  el.volume = Math.max(0, Math.min(1, +el.dataset.gain * 0.8));
  if (el.paused) el.play().catch(() => {});
}
function tuneIn(m) {
  let el = radios[m.thing];
  if (!m.url) {
    if (el) { el.pause(); el.removeAttribute('src'); el.load(); delete radios[m.thing]; }
    return;
  }
  if (!el || el.dataset.url !== m.url) {
    if (el) el.pause();
    el = radios[m.thing] = new Audio();
    el.dataset.url = m.url;
    el.src = m.url;
  }
  el.dataset.gain = m.gain;
  if (soundOn) playRadio(el);
  else tellOnce('soundoff', '📻 There\'s a radio playing nearby. Turn the sound on (🔇 above the map) to hear it.');
}

// Keep the command box ready. A click anywhere else hands focus back to it,
// and so does just starting to type, unless something else wants the keys
// (the join screen, a noticeboard, a box of its own) or text is being selected.
const pointerFine = matchMedia('(pointer: fine)');
const elsewhere = () =>
  getComputedStyle($('#join')).display !== 'none' || $('#board').classList.contains('on');
const ownInput = (el) => el && el.closest && el.closest('input, textarea, select');
document.addEventListener('click', (e) => {
  // On a phone that would pop the keyboard up at every tap.
  if (!pointerFine.matches || elsewhere() || ownInput(e.target)) return;
  if (getSelection().toString()) return;
  $('#cmd').focus({ preventScroll: true });
});
document.addEventListener('keydown', (e) => {
  if (elsewhere() || ownInput(document.activeElement)) return;
  if (e.metaKey || e.ctrlKey || e.altKey || e.key.length !== 1) return;
  // Space on a focused button presses it.
  if (e.key === ' ' && document.activeElement?.closest('button, [role=button]')) return;
  $('#cmd').focus({ preventScroll: true });
});

// ---- sound: hums become notes, rain sounds like rain --------------------

$('#sound').onclick = () => {
  soundOn = !soundOn;
  $('#sound').textContent = soundOn ? '🔊 sound on' : '🔇 sound off';
  if (soundOn && !audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  if (audio) audio.resume();
  updateRain();
  for (const el of Object.values(radios)) soundOn ? playRadio(el) : el.pause();
  if (!soundOn) for (const t of Object.keys(listening)) unhear(t);
};

const SEMI = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 };
function playTune(text) {
  if (!soundOn || !audio) return;
  const notes = [...text.matchAll(/\b([a-gA-G])([#b]?)([2-6]?)\b/g)];
  let t = audio.currentTime + 0.05;
  for (const [, l, acc, oct] of notes.slice(0, 32)) {
    const semi = SEMI[l.toLowerCase()] + (acc === '#' ? 1 : acc === 'b' ? -1 : 0);
    const midi = 12 * ((+oct || 4) + 1) + semi;
    const freq = 440 * Math.pow(2, (midi - 69) / 12);
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.18, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
    o.connect(g).connect(audio.destination);
    o.start(t); o.stop(t + 0.5);
    t += 0.3;
  }
}

function updateRain() {
  if (!audio) return;
  const level = !soundOn ? 0 : /\brain\b/.test(sky) ? 0.12 : /drizzle/.test(sky) ? 0.05 : 0;
  if (!rain) {
    const len = audio.sampleRate * 2, buf = audio.createBuffer(1, len, audio.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = audio.createBufferSource(); src.buffer = buf; src.loop = true;
    const filter = audio.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 1400;
    const gain = audio.createGain(); gain.gain.value = 0;
    src.connect(filter).connect(gain).connect(audio.destination);
    src.start();
    rain = gain;
  }
  rain.gain.setTargetAtTime(level, audio.currentTime, 1.5);
}
