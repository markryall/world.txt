<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>world.txt</title>
<style>
  :root {
    --bg: #15121c; --panel: #1d1927; --line: #2c2639; --fg: #e6e1ef;
    --plain: #e6e1ef; --dim: #8d849e; --white: #ffffff; --blue: #6aa8ff; --deep_blue: #3b5bdb;
    --cyan: #5fe0e0; --green: #7ed87e; --dark_green: #3f9a4f; --yellow: #ffd866; --sand: #e8cf9a;
    --magenta: #ff79c6; --pink: #ffa7d6; --red: #ff6b6b; --brown: #c08a5a; --grey: #a0a0a8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body { font: 15px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; display: flex; flex-direction: column; height: 100dvh; }
  #app { flex: 1; display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
  #log { overflow-y: auto; padding: 14px 16px; white-space: pre-wrap; word-wrap: break-word; }
  #log .ln { min-height: 1.45em; border-radius: 4px; }
  #log .ln:hover { background: var(--panel); }
  #side { background: var(--panel); border-left: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  #place { color: var(--magenta); font-weight: bold; }
  #map { font-size: 16px; line-height: 1.15; white-space: pre; text-align: center; padding: 6px 0; }
  .meta { color: var(--dim); font-size: 13px; }
  #pad { display: grid; grid-template-columns: repeat(3, 52px); gap: 6px; justify-content: center; }
  #pad button, .quick button {
    background: var(--line); color: var(--fg); border: 0; border-radius: 10px; font: inherit;
    height: 44px; cursor: pointer; touch-action: manipulation;
  }
  #pad button:active, .quick button:active { background: var(--magenta); color: var(--bg); }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .quick button { padding: 0 12px; height: 36px; font-size: 13px; }
  form#input { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--panel); }
  #cmd { flex: 1; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 16px; outline: none; }
  #cmd:focus { border-color: var(--magenta); }
  #join { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #join form { text-align: center; max-width: 360px; width: 100%; }
  #join h1 { color: var(--magenta); font-weight: normal; letter-spacing: 2px; }
  #join p { color: var(--dim); }
  #join input { width: 100%; font: inherit; font-size: 18px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); text-align: center; outline: none; }
  #join button { margin-top: 12px; width: 100%; font: inherit; font-size: 17px; padding: 12px; border: 0; border-radius: 12px; background: var(--magenta); color: var(--bg); cursor: pointer; }
  #here a { color: var(--cyan); }
  #hint { display: none; align-items: center; gap: 10px; padding: 10px 14px; background: var(--panel);
    border-top: 1px solid var(--line); color: var(--yellow); font-weight: bold; cursor: pointer; }
  #hint.on { display: flex; animation: glow 2s ease-in-out infinite; }
  #gramo { display: none; align-items: center; gap: 10px; padding: 8px 14px; background: var(--panel);
    border-top: 1px solid var(--line); color: var(--pink); font-size: 14px; }
  #gramo.on { display: flex; }
  #gramo-msg { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #gramo label, #gramo button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg); white-space: nowrap; }
  #hint .go { margin-left: auto; background: var(--yellow); color: var(--bg); border-radius: 8px; padding: 4px 10px; font-size: 13px; }
  #hint .skip { color: var(--dim); font-weight: normal; font-size: 12px; text-decoration: underline; }
  @keyframes glow { 50% { background: #2a2333; } }
  .pulse { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { background: var(--yellow); color: var(--bg); } }
  @media (prefers-reduced-motion: reduce) { #hint.on, .pulse { animation: none; } .pulse { outline: 2px solid var(--yellow); } }
  #sound { background: none; border: 0; color: var(--dim); font: inherit; cursor: pointer; padding: 0; }
  #board { position: fixed; inset: 6vh 50% auto auto; transform: translateX(50%); width: min(560px, 94vw);
    height: 80vh; display: none; flex-direction: column; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.5); z-index: 5; overflow: hidden; }
  #board.on { display: flex; }
  #board header { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  #board h2 { margin: 0; font-size: 16px; color: var(--yellow); flex: 1; }
  #board .page { width: 100%; color: var(--dim); font-size: 13px; }
  #board select { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 13px; padding: 4px; }
  #board .close { background: none; border: 0; color: var(--dim); font-size: 22px; cursor: pointer; line-height: 1; }
  #notes { flex: 1; overflow-y: auto; padding: 10px 14px; white-space: pre-wrap; word-wrap: break-word; }
  #notes .n { margin: 0 0 10px; }
  #notes .who { color: var(--cyan); font-weight: bold; }
  #notes .when { color: var(--dim); font-size: 12px; margin-left: 6px; }
  #notes .older { color: var(--dim); text-align: center; font-size: 12px; padding: 4px 0 10px; }
  #board form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
  #board form input { flex: 1; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 16px; outline: none; }
  #board form button { background: var(--yellow); color: var(--bg); border: 0; border-radius: 10px; padding: 0 14px; font: inherit; cursor: pointer; }
  @media (max-width: 720px) { #board { inset: 0; transform: none; width: auto; height: auto; border-radius: 0; } }
  #chips { display: none; gap: 6px; overflow-x: auto; padding: 8px 12px 0; background: var(--panel);
    border-top: 1px solid var(--line); scrollbar-width: none; }
  #chips::-webkit-scrollbar { display: none; }
  #chips button { flex: none; background: var(--line); color: var(--fg); border: 0; border-radius: 16px;
    font: inherit; font-size: 14px; height: 34px; padding: 0 12px; touch-action: manipulation; }
  #chips button:active { background: var(--magenta); color: var(--bg); }
  @media (max-width: 720px) {
    #chips { display: flex; }
    #input { border-top: 0; }
    /* While typing, the keyboard needs the room: keep just the place name. */
    body.typing #map, body.typing #pad, body.typing #weather, body.typing #clock,
    body.typing #here, body.typing #sound { display: none; }
    body.typing #side { padding: 6px 12px; }
    #app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    #side { order: -1; border-left: 0; border-bottom: 1px solid var(--line); flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: center; padding: 8px; gap: 8px 14px; }
    #map { font-size: 13px; padding: 0; }
    #pad { grid-template-columns: repeat(3, 42px); gap: 4px; }
    #pad button { height: 34px; }
    .info { flex: 1; min-width: 150px; }
    .quick { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="log" aria-live="polite"></div>
  <div id="side">
    <div class="info">
      <div id="place">…</div>
      <div class="meta" id="weather"></div>
      <div class="meta" id="clock"></div>
      <div class="meta" id="here"></div>
      <button id="sound" type="button">🔇 sound off</button>
    </div>
    <div id="map"></div>
    <div id="pad">
      <button data-c="nw">↖</button><button data-c="n">↑</button><button data-c="ne">↗</button>
      <button data-c="w">←</button><button data-c="look">👀</button><button data-c="e">→</button>
      <button data-c="sw">↙</button><button data-c="s">↓</button><button data-c="se">↘</button>
    </div>
    <div class="quick">
      <button data-prefill="chat ">💬 chat</button><button data-c="who">who</button><button data-c="help">help</button>
      <button data-c="dig">dig</button><button data-c="plant flowers">🌼</button>
      <button data-c="plant tree">🌳</button><button data-c="gather">🧺 gather</button><button data-c="satchel">satchel</button><button data-c="dance">💃</button>
    </div>
  </div>
</div>
<div id="hint" role="button" tabindex="0">
  <span id="hint-text"></span><span class="go">try it</span><span class="skip" id="hint-skip">skip</span>
</div>
<div id="chips">
  <button data-prefill="say ">💬 say</button><button data-c="gather">🧺 gather</button>
  <button data-c="satchel">satchel</button><button data-c="journal">📖 journal</button>
  <button data-c="plant flowers">🌼 plant</button><button data-c="fish">🎣 fish</button>
  <button data-prefill="chat ">📣 chat</button><button data-c="who">who</button>
  <button data-c="read">📌 read</button><button data-c="map">🗺 map</button><button data-c="look">👀 look</button><button data-c="help">help</button>
</div>
<div id="gramo">
  <span id="gramo-msg">🎶 Choose some songs to play on the gramophone</span>
  <label>🎵 choose songs<input id="gramo-files" type="file" accept="audio/*" multiple hidden></label>
  <button id="gramo-stop" type="button">⏹ stop</button>
</div>
<form id="input" autocomplete="off">
  <input id="cmd" placeholder="say hi, dig, make a frog that croaks when it rains…" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
</form>
<div id="board" role="dialog" aria-label="noticeboard">
  <header>
    <h2 id="board-title"></h2>
    <select id="board-weeks" aria-label="past weeks"></select>
    <button class="close" id="board-close" aria-label="close">×</button>
    <div class="page" id="board-page"></div>
  </header>
  <div id="notes"></div>
  <form id="board-post" autocomplete="off">
    <input id="board-text" placeholder="leave a note…" maxlength="280" enterkeyhint="send">
    <button>post</button>
  </form>
</div>
<div id="join">
  <form>
    <h1>✨ world.txt ✨</h1>
    <p>a small island · no battles · just bonhomie</p>
    <p id="join-msg"></p>
    <button id="join-go" type="submit" hidden>Enter the world 🌍</button>
  </form>
</div>
<script>
const $ = (s) => document.querySelector(s);
const log = $('#log');
let ws, sky = '', audio, soundOn = false, rain;
const typed = []; let hist = 0;

function addLines(lines) {
  const stick = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  for (const line of lines) {
    const div = document.createElement('div');
    div.className = 'ln';
    // When it happened, on hover.
    div.title = new Date().toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' });
    div.appendChild(paintLine(line));
    log.appendChild(div);
    const tune = line.map((s) => s.t).join('').match(/♪ (.+) ♪/);
    if (tune) playTune(tune[1]);
  }
  while (log.childNodes.length > 1000) log.removeChild(log.firstChild);
  if (stick) log.scrollTop = log.scrollHeight;
}

function paintLine(line) {
  const frag = document.createDocumentFragment();
  for (const s of line) {
    const span = document.createElement('span');
    span.textContent = s.t.replace('<world address>', location.origin + location.pathname.replace(/\/$/, ''));
    span.style.color = `var(--${s.c})`;
    if (s.b) span.style.fontWeight = 'bold';
    frag.appendChild(span);
  }
  return frag;
}

// Ask for the plain-text look of symbols phones like to draw as wide emoji
// (☺ ♣ ▲ ☀ ☁ …), so the map's columns stay lined up.
const textStyle = (s) => ({ ...s, t: s.t.replace(/([\u2600-\u27BF])(?!\uFE0E)/g, '$1\uFE0E') });

function status(m) {
  $('#place').textContent = m.place;
  $('#weather').textContent = m.weather;
  $('#clock').textContent = m.clock;
  const here = $('#here');
  here.replaceChildren();
  if (m.here.length) here.append('☺ ');
  m.here.forEach((name, i) => {
    if (i) here.append(', ');
    const a = document.createElement('a');
    a.textContent = name; a.href = '#'; a.title = 'talk to ' + name;
    a.onclick = (e) => { e.preventDefault(); prefill('@' + name + ' '); };
    here.append(a);
  });
  const map = $('#map');
  map.replaceChildren();
  m.map.forEach((line, i) => {
    if (i) map.appendChild(document.createTextNode('\n'));
    map.appendChild(paintLine(line.map(textStyle)));
  });
  sky = m.weather;
  updateRain();
}

// ---- signing in ----------------------------------------------------------
// The world is invite-only. A magic link (#invite=...) is used once and
// swapped for a device token, kept here so next time just works.
const stored = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const store = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };
const params = new URLSearchParams(location.hash.slice(1));
let invite = params.get('invite');
// Arriving from another world, with a passport from home.
let passport = params.get('passport');

function showJoin(message, enter = false) {
  $('#join').style.display = 'flex';
  $('#join-msg').textContent = message;
  $('#join-go').hidden = !enter;
  if (enter) $('#join-go').focus();
}
$('#join form').onsubmit = (e) => {
  e.preventDefault();
  if (!$('#join-go').hidden) start();
};

function start() {
  $('#join').style.display = 'none';
  connect();
  $('#cmd').focus();
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/`);
  ws.onopen = () => ws.send(JSON.stringify({
    // A device token for this world wins: they've been here before.
    type: 'hello', invite, token: invite ? null : stored('world.token'),
    passport: invite || stored('world.token') ? null : passport,
  }));
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'lines') addLines(m.lines);
    else if (m.type === 'status') status(m);
    else if (m.type === 'hint') hint(m);
    else if (m.type === 'board') board(m);
    else if (m.type === 'spin_start') hostStart(m.thing);
    else if (m.type === 'spin_stop') hostStop();
    else if (m.type === 'audio') hear(m);
    else if (m.type === 'audio_end') unhear(m.thing);
    else if (m.type === 'radio') tuneIn(m);
    else if (m.type === 'travel') {
      // Off to another world (or home): row there in a moment.
      setTimeout(() => { location.href = m.url; }, 1800);
    } else if (m.type === 'welcome') {
      if (m.token) store('world.token', m.token);
      // The invite or passport is used up: tidy it out of the address bar.
      invite = null;
      passport = null;
      history.replaceState(null, '', location.pathname);
    } else if (m.type === 'bye') {
      if (m.reason.includes('🛂')) {
        showJoin(m.reason);
      } else if (invite && m.reason.includes('invite') && stored('world.token')) {
        // An old link left in the address bar, but this device is already
        // signed in: drop the link and come in with the device's token.
        invite = null;
        history.replaceState(null, '', location.pathname);
        connect();
      } else if (m.reason.includes('invite') || m.reason.includes('signed in')) {
        if (m.reason.includes('signed in')) store('world.token', null);
        showJoin(m.reason);
      } else {
        addLines([[{ t: m.reason, c: 'magenta' }]]);
      }
    }
  };
  ws.onclose = (e) => {
    // A connection we've already replaced (signing in again) can go quietly.
    if (e.target === ws) addLines([[{ t: '✧ The world fades. Refresh to wander back in.', c: 'dim' }]]);
  };
}

// ---- noticeboards ------------------------------------------------------
let boardId = null, boardMore = false, boardLoading = false;
const notesEl = $('#notes');
function noteEl(n) {
  const d = document.createElement('div');
  d.className = 'n';
  const who = document.createElement('span'); who.className = 'who'; who.textContent = n.author;
  const when = document.createElement('span'); when.className = 'when'; when.textContent = n.when;
  d.append(who, when, document.createElement('br'), document.createTextNode(n.text));
  return d;
}
function olderMarker() {
  const d = document.createElement('div');
  d.className = 'older';
  d.textContent = boardMore ? '↑ scroll up for older notes' : 'the very first note';
  return d;
}
function board(m) {
  if (m.mode === 'new') {
    if (boardId !== m.board || !$('#board').classList.contains('on')) return;
    const stick = notesEl.scrollHeight - notesEl.scrollTop - notesEl.clientHeight < 60;
    m.notes.forEach((n) => notesEl.append(noteEl(n)));
    if (stick) notesEl.scrollTop = notesEl.scrollHeight;
    return;
  }
  boardMore = m.more; boardLoading = false;
  if (m.mode === 'older') {
    const before = notesEl.scrollHeight;
    notesEl.querySelector('.older')?.remove();
    notesEl.prepend(olderMarker(), ...m.notes.map(noteEl));
    notesEl.scrollTop += notesEl.scrollHeight - before;
    return;
  }
  boardId = m.board;
  $('#board-title').textContent = m.title;
  $('#board-page').textContent = m.page || '';
  const weeks = $('#board-weeks');
  weeks.replaceChildren();
  weeks.style.display = m.weeks.length ? '' : 'none';
  if (m.weeks.length) {
    weeks.append(new Option('this week', ''));
    m.weeks.forEach((w) => weeks.append(new Option(w.label, w.key)));
  }
  notesEl.replaceChildren(olderMarker(), ...m.notes.map(noteEl));
  if (!m.notes.length) notesEl.append(Object.assign(document.createElement('div'), { className: 'older', textContent: 'Nothing here yet. Be the first!' }));
  $('#board').classList.add('on');
  notesEl.scrollTop = notesEl.scrollHeight;
}
notesEl.addEventListener('scroll', () => {
  if (notesEl.scrollTop < 30 && boardMore && !boardLoading) { boardLoading = true; send('read more'); }
});
$('#board-weeks').onchange = (e) => send(e.target.value ? 'read week ' + e.target.value : 'read');
$('#board-close').onclick = () => $('#board').classList.remove('on');
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#board').classList.remove('on'); });
$('#board-post').onsubmit = (e) => {
  e.preventDefault();
  const t = $('#board-text').value.trim();
  if (!t) return;
  send('post ' + t);
  $('#board-text').value = '';
};

let hintCmd = null;
function hint(m) {
  hintCmd = m.cmd;
  $('#hint-text').textContent = m.text || '';
  $('#hint').classList.toggle('on', !!m.text);
  document.querySelectorAll('.pulse').forEach((b) => b.classList.remove('pulse'));
  if (m.cmd) document.querySelectorAll('[data-c]').forEach((b) => {
    if (b.dataset.c === m.cmd) b.classList.add('pulse');
  });
}
$('#hint').onclick = (e) => {
  if (e.target.id === 'hint-skip') send('skip');
  else if (hintCmd) send(hintCmd);
};
$('#hint').onkeydown = (e) => { if (e.key === 'Enter' && hintCmd) send(hintCmd); };

// Keep people discovering things after first steps.
const IDEAS = [
  'say hi, dig, make a frog that croaks when it rains…',
  'try: make a lantern that glows at night',
  'try: plant tree',
  'try: name The Willow Bank',
  'try: hum C E G E C',
  'try: @Moss hello!',
  'try: dig twice to make a pond',
  'try: find Poppy',
  'try: catch butterfly',
  'try: fish (by the water)',
  'try: journal',
  'try: give daisy to Poppy',
  'try: make a noticeboard',
  'try: recipes',
  'try: claim (to make a home)',
  'try: read (at a noticeboard)',
  'try: make a doorbell that rings when someone arrives',
];
let idea = 0;
setInterval(() => {
  const c = $('#cmd');
  if (c.value || document.activeElement === c) return;
  idea = (idea + 1) % IDEAS.length;
  c.placeholder = IDEAS[idea];
}, 6000);

function prefill(text) {
  const c = $('#cmd');
  c.value = text;
  c.focus();
  c.setSelectionRange(text.length, text.length);
}

function send(text) {
  if (!ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type: 'cmd', text }));
}

// An invite waits for a real click: link previews (iMessage, mail scanners)
// load the page and run its script, and would use the one-use link up.
if (invite) showJoin("You've been invited 💌", true);
else if (passport || stored('world.token')) start();
else showJoin('world.txt is invite-only. Open the magic link an island keeper sent you! 💌');

$('#input').onsubmit = (e) => {
  e.preventDefault();
  const text = $('#cmd').value;
  if (!text.trim()) return;
  typed.push(text); hist = typed.length;
  send(text);
  $('#cmd').value = '';
};
$('#cmd').onkeydown = (e) => {
  if (e.key === 'ArrowUp' && hist > 0) { hist--; $('#cmd').value = typed[hist]; e.preventDefault(); }
  if (e.key === 'ArrowDown') { hist = Math.min(typed.length, hist + 1); $('#cmd').value = typed[hist] || ''; e.preventDefault(); }
};
document.querySelectorAll('[data-c]').forEach((b) => b.onclick = () => send(b.dataset.c));

// Phones: give the conversation the room while the keyboard is up.
const cmdBox = $('#cmd');
cmdBox.addEventListener('focus', () => document.body.classList.add('typing'));
cmdBox.addEventListener('blur', () => setTimeout(() => {
  if (document.activeElement !== cmdBox) document.body.classList.remove('typing');
}, 150));
// Chips keep the keyboard up instead of stealing focus.
document.querySelectorAll('#chips button').forEach((b) =>
  b.addEventListener('mousedown', (e) => { if (document.activeElement === cmdBox) e.preventDefault(); }));
if (window.visualViewport) {
  const fit = () => {
    document.body.style.height = window.visualViewport.height + 'px';
    window.scrollTo(0, 0);
    log.scrollTop = log.scrollHeight;
  };
  window.visualViewport.addEventListener('resize', fit);
  fit();
}
document.querySelectorAll('[data-prefill]').forEach((b) => b.onclick = () => prefill(b.dataset.prefill));

// ---- gramophones and radios ---------------------------------------------
// Someone near a gramophone hears songs from another player's computer: the
// player's browser encodes them (Opus, 20ms frames) and the world passes them
// on with how loud they are where you stand. Radios are simpler: the world
// says which stream is in earshot and how loud, and the browser plays it.
// Either way, the world makes sure you only ever hear one at a time.

const b64 = (bytes) => { let s = ''; for (const b of bytes) s += String.fromCharCode(b); return btoa(s); };
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const told = new Set();
function tellOnce(key, text) {
  if (told.has(key)) return;
  told.add(key);
  addLines([[{ t: text, c: 'pink' }]]);
}

// Playing: this browser is the gramophone's record player.
const FRAME = 960; // 20ms at 48kHz
const TAP = `class Tap extends AudioWorkletProcessor {
  process(inputs, outputs) {
    const i = inputs[0], o = outputs[0];
    if (i.length) {
      for (let c = 0; c < o.length; c++) o[c].set(i[Math.min(c, i.length - 1)]);
      this.port.postMessage([i[0].slice(), (i[1] || i[0]).slice()]);
    }
    return true;
  }
}
registerProcessor('tap', Tap);`;
const gramo = { thing: null, ctx: null, el: null, encoder: null, timer: null, files: [], idx: 0, ts: 0, pending: [], title: null,
  accL: new Float32Array(FRAME), accR: new Float32Array(FRAME), accN: 0 };

function hostStart(thing) {
  gramo.thing = thing;
  $('#gramo').classList.add('on');
  $('#gramo-msg').textContent = 'AudioEncoder' in window
    ? '🎶 Choose some songs to play on the gramophone'
    : "🎶 This browser can't play to a gramophone yet. Chrome can!";
}

async function hostPlay(files) {
  if (!files.length || !('AudioEncoder' in window)) return;
  gramo.files = [...files];
  gramo.idx = 0;
  try {
    if (!gramo.ctx) {
      const ctx = new AudioContext({ sampleRate: 48000 });
      await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([TAP], { type: 'application/javascript' })));
      const el = new Audio();
      el.onended = () => { gramo.idx = (gramo.idx + 1) % gramo.files.length; playTrack(); };
      const tap = new AudioWorkletNode(ctx, 'tap', { outputChannelCount: [2] });
      ctx.createMediaElementSource(el).connect(tap).connect(ctx.destination);
      tap.port.onmessage = (e) => encode(e.data);
      const encoder = new AudioEncoder({
        output: (chunk) => { const b = new Uint8Array(chunk.byteLength); chunk.copyTo(b); gramo.pending.push(b64(b)); },
        error: (e) => { $('#gramo-msg').textContent = `🎶 Couldn't play that: ${e.message}`; },
      });
      encoder.configure({ codec: 'opus', sampleRate: 48000, numberOfChannels: 2, bitrate: 96000 });
      Object.assign(gramo, { ctx, el, encoder, timer: setInterval(sendAudio, 200) });
    }
    await gramo.ctx.resume();
    playTrack();
  } catch (e) {
    $('#gramo-msg').textContent = `🎶 Couldn't start the gramophone: ${e.message}`;
  }
}

function playTrack() {
  const f = gramo.files[gramo.idx];
  if (!f) return;
  if (gramo.el.src) URL.revokeObjectURL(gramo.el.src);
  gramo.el.src = URL.createObjectURL(f);
  gramo.title = f.name.replace(/\.[^.]+$/, '');
  $('#gramo-msg').textContent = `🎶 Playing ${gramo.title}`;
  gramo.el.play().catch(() => {});
}

// Gather the tapped sound into 20ms frames for the encoder.
function encode([l, r]) {
  if (!gramo.encoder || gramo.encoder.state !== 'configured') return;
  for (let off = 0; off < l.length;) {
    const n = Math.min(FRAME - gramo.accN, l.length - off);
    gramo.accL.set(l.subarray(off, off + n), gramo.accN);
    gramo.accR.set(r.subarray(off, off + n), gramo.accN);
    gramo.accN += n; off += n;
    if (gramo.accN === FRAME) {
      const data = new Float32Array(FRAME * 2);
      data.set(gramo.accL, 0); data.set(gramo.accR, FRAME);
      const frame = new AudioData({ format: 'f32-planar', sampleRate: 48000, numberOfFrames: FRAME, numberOfChannels: 2, timestamp: gramo.ts, data });
      gramo.ts += 20000;
      gramo.encoder.encode(frame);
      frame.close();
      gramo.accN = 0;
    }
  }
}

function sendAudio() {
  if (!gramo.pending.length || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type: 'audio', frames: gramo.pending.splice(0, 50), title: gramo.title }));
}

function hostStop() {
  clearInterval(gramo.timer);
  try { gramo.encoder?.close(); } catch {}
  gramo.el?.pause();
  gramo.ctx?.close();
  Object.assign(gramo, { thing: null, ctx: null, el: null, encoder: null, timer: null, files: [], pending: [], title: null, accN: 0 });
  $('#gramo').classList.remove('on');
  $('#gramo-files').value = '';
}

$('#gramo-files').onchange = (e) => hostPlay(e.target.files);
$('#gramo-stop').onclick = () => send('stop music');

// Listening: frames from a gramophone in earshot, played a moment behind.
const listening = {};
function hear(m) {
  if (!('AudioDecoder' in window)) return tellOnce('nodecoder', "🎶 There's music nearby, but this browser can't play it yet.");
  if (!soundOn || !audio) return tellOnce('soundoff', '🎶 There\'s music playing nearby. Turn the sound on (🔇 above the map) to hear it.');
  let l = listening[m.thing];
  if (!l) {
    const gain = audio.createGain();
    gain.gain.value = 0;
    gain.connect(audio.destination);
    l = listening[m.thing] = { gain, next: 0, ts: 0 };
    l.dec = new AudioDecoder({ output: (frame) => playFrame(l, frame), error: () => {} });
    l.dec.configure({ codec: 'opus', sampleRate: 48000, numberOfChannels: 2 });
  }
  l.gain.gain.setTargetAtTime(m.gain * 0.8, audio.currentTime, 0.4);
  for (const f of m.frames) {
    l.dec.decode(new EncodedAudioChunk({ type: 'key', timestamp: l.ts, data: unb64(f) }));
    l.ts += 20000;
  }
}

function playFrame(l, frame) {
  const buf = audio.createBuffer(frame.numberOfChannels, frame.numberOfFrames, frame.sampleRate);
  for (let c = 0; c < frame.numberOfChannels; c++) {
    const ch = new Float32Array(frame.numberOfFrames);
    frame.copyTo(ch, { planeIndex: c, format: 'f32-planar' });
    buf.copyToChannel(ch, c);
  }
  frame.close();
  // A little behind, so the network's wobbles don't make gaps; start afresh after one.
  const now = audio.currentTime;
  if (l.next < now + 0.05) l.next = now + 0.4;
  const src = audio.createBufferSource();
  src.buffer = buf;
  src.connect(l.gain);
  src.start(l.next);
  l.next += buf.duration;
}

function unhear(thing) {
  const l = listening[thing];
  if (!l) return;
  delete listening[thing];
  l.gain.gain.setTargetAtTime(0, audio.currentTime, 0.3);
  try { l.dec.close(); } catch {}
  setTimeout(() => l.gain.disconnect(), 2000);
}

// Radios: the station's own stream, at a volume for how near you are.
const radios = {};
function playRadio(el) {
  el.volume = Math.max(0, Math.min(1, +el.dataset.gain * 0.8));
  if (el.paused) el.play().catch(() => {});
}
function tuneIn(m) {
  let el = radios[m.thing];
  if (!m.url) {
    if (el) { el.pause(); el.removeAttribute('src'); el.load(); delete radios[m.thing]; }
    return;
  }
  if (!el || el.dataset.url !== m.url) {
    if (el) el.pause();
    el = radios[m.thing] = new Audio();
    el.dataset.url = m.url;
    el.src = m.url;
  }
  el.dataset.gain = m.gain;
  if (soundOn) playRadio(el);
  else tellOnce('soundoff', '📻 There\'s a radio playing nearby. Turn the sound on (🔇 above the map) to hear it.');
}

// Keep the command box ready. A click anywhere else hands focus back to it,
// and so does just starting to type, unless something else wants the keys
// (the join screen, a noticeboard, a box of its own) or text is being selected.
const pointerFine = matchMedia('(pointer: fine)');
const elsewhere = () =>
  getComputedStyle($('#join')).display !== 'none' || $('#board').classList.contains('on');
const ownInput = (el) => el && el.closest && el.closest('input, textarea, select');
document.addEventListener('click', (e) => {
  // On a phone that would pop the keyboard up at every tap.
  if (!pointerFine.matches || elsewhere() || ownInput(e.target)) return;
  if (getSelection().toString()) return;
  $('#cmd').focus({ preventScroll: true });
});
document.addEventListener('keydown', (e) => {
  if (elsewhere() || ownInput(document.activeElement)) return;
  if (e.metaKey || e.ctrlKey || e.altKey || e.key.length !== 1) return;
  // Space on a focused button presses it.
  if (e.key === ' ' && document.activeElement?.closest('button, [role=button]')) return;
  $('#cmd').focus({ preventScroll: true });
});

// ---- sound: hums become notes, rain sounds like rain --------------------

$('#sound').onclick = () => {
  soundOn = !soundOn;
  $('#sound').textContent = soundOn ? '🔊 sound on' : '🔇 sound off';
  if (soundOn && !audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  if (audio) audio.resume();
  updateRain();
  for (const el of Object.values(radios)) soundOn ? playRadio(el) : el.pause();
  if (!soundOn) for (const t of Object.keys(listening)) unhear(t);
};

const SEMI = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 };
function playTune(text) {
  if (!soundOn || !audio) return;
  const notes = [...text.matchAll(/\b([a-gA-G])([#b]?)([2-6]?)\b/g)];
  let t = audio.currentTime + 0.05;
  for (const [, l, acc, oct] of notes.slice(0, 32)) {
    const semi = SEMI[l.toLowerCase()] + (acc === '#' ? 1 : acc === 'b' ? -1 : 0);
    const midi = 12 * ((+oct || 4) + 1) + semi;
    const freq = 440 * Math.pow(2, (midi - 69) / 12);
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.18, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
    o.connect(g).connect(audio.destination);
    o.start(t); o.stop(t + 0.5);
    t += 0.3;
  }
}

function updateRain() {
  if (!audio) return;
  const level = !soundOn ? 0 : /\brain\b/.test(sky) ? 0.12 : /drizzle/.test(sky) ? 0.05 : 0;
  if (!rain) {
    const len = audio.sampleRate * 2, buf = audio.createBuffer(1, len, audio.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = audio.createBufferSource(); src.buffer = buf; src.loop = true;
    const filter = audio.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 1400;
    const gain = audio.createGain(); gain.gain.value = 0;
    src.connect(filter).connect(gain).connect(audio.destination);
    src.start();
    rain = gain;
  }
  rain.gain.setTargetAtTime(level, audio.currentTime, 1.5);
}
</script>
</body>
