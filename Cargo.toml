[package]
name = "world-txt"
version = "0.7.0"
edition = "2024"
license = "MIT"
description = "A cozy multiplayer text world: wander, chat, garden and craft on a shared island. No battles, just bonhomie."
repository = "https://github.com/markryall/world.txt"
homepage = "https://github.com/markryall/world.txt"
readme = "README.md"
keywords = ["game", "mud", "multiplayer", "terminal", "cozy"]
categories = ["games", "command-line-utilities"]
exclude = [".cards/", ".cards.toml", ".claude/", "tmp/", "*.db", "*.db-*", "deploy/", "Dockerfile", ".dockerignore"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.5", features = ["json"] }
rusqlite = { version = "0.41.1", features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
